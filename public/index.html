
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAPTAIN AI</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #070a13;
      color: #00f0ff;
      font-family: Arial, sans-serif;
    }
    h1 { text-align: center; }
    #chat {
      height: 65vh;
      overflow-y: auto;
      padding: 12px;
      background: #111827;
      border-radius: 12px;
      color: white;
    }
    input {
      width: 68%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #00f0ff;
      background: #111827;
      color: white;
    }
    button {
      padding: 13px;
      background: #00f0ff;
      border: 0;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>⚡ CAPTAIN AI</h1>
  <div id="chat">
    <p>CAPTAIN AI: Hello! আমি প্রস্তুত। কী জানতে চাও?</p>
  </div>
  <br>
  <input id="message" placeholder="কিছু লিখুন...">
  <button onclick="sendMessage()">Send</button>

  <script>
    async function sendMessage() {
      const input = document.getElementById("message");
      const chat = document.getElementById("chat");
      const message = input.value.trim();
      if (!message) return;

      chat.innerHTML += "<p>You: " + message.replace(/</g, "&lt;") + "</p>";
      input.value = "";

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({message})
        });
        const data = await response.json();
        chat.innerHTML += "<p>CAPTAIN AI: " +
          (data.reply || data.error || "কোনো উত্তর পাওয়া যায়নি") +
          "</p>";
      } catch (error) {
        chat.innerHTML += "<p>সার্ভারের সঙ্গে যোগাযোগ হচ্ছে না।</p>";
      }
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
